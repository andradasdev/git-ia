<style>
  /* Cores do Manual de Identidade Visual da Marinha do Brasil */
  :root {
    --azul:  #050F41;
    --ouro:  #FAB932;
    --verde: #079551;
    --fundo: #f3f4f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--fundo);
    color: var(--azul);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 1rem;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1.25rem;
    background: var(--azul);
    color: #fff;
    border-bottom: 3px solid var(--ouro);
  }
  header .titulo { display: flex; flex-direction: column; gap: .1rem; }
  header .marca { font-size: .75rem; font-weight: 700; letter-spacing: .12em; color: var(--ouro); }
  header h1 { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.3; }
  header .acoes { display: flex; gap: .5rem; flex-wrap: wrap; }
  header a, header button {
    display: inline-block;
    padding: .4rem .85rem;
    border-radius: 999px;
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,.45);
    cursor: pointer;
  }
  header a:hover, header a:focus-visible,
  header button:hover, header button:focus-visible { background: var(--verde); border-color: var(--verde); }
  header a.primario { background: var(--ouro); border-color: var(--ouro); color: var(--azul); }
  header a.primario:hover, header a.primario:focus-visible { background: #fff; border-color: #fff; }
  header button[aria-pressed="true"] { background: rgba(255,255,255,.16); border-color: #fff; }

  main { flex: 1 1 auto; min-height: 0; }
  object { width: 100%; height: 100%; border: none; display: block; }

  /* Só aparece se o navegador não conseguir embutir o PDF (iOS, alguns
     navegadores móveis). Fica DENTRO do <object>, como conteúdo alternativo. */
  .fallback {
    max-width: 34rem;
    margin: 3rem auto;
    padding: 0 1.5rem;
    text-align: center;
    line-height: 1.6;
  }
  .fallback a { color: var(--verde); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="titulo">
    <span class="marca">GIT · IA · DOCS</span>
    <h1>Git, GitLab e IA aplicada à Engenharia de Software</h1>
  </div>
  <nav class="acoes">
    <a class="primario" href="./docs/apostila.pdf" download>Baixar a apostila</a>
    <button type="button" data-pdf="./docs/apostila.pdf" aria-pressed="true">Ver apostila</button>
    <button type="button" data-pdf="./docs/apresentacao.pdf" aria-pressed="false">Ver slides</button>
    <a href="https://github.com/ronidomingues/git-ia-docs">Código-fonte</a>
  </nav>
</header>

<main id="visor">
  <object data="./docs/apostila.pdf" type="application/pdf">
    <div class="fallback">
      <p>Seu navegador não consegue exibir o PDF nesta página.</p>
      <p><a href="./docs/apostila.pdf">Abrir a apostila</a> · <a href="./docs/apresentacao.pdf">Abrir os slides</a></p>
    </div>
  </object>
</main>

<script>
  // Troca o PDF exibido. O <object> é recriado porque alguns navegadores
  // ignoram a mudança do atributo "data" depois que o PDF já carregou.
  const visor = document.getElementById('visor');
  const botoes = document.querySelectorAll('button[data-pdf]');
  botoes.forEach(botao => botao.addEventListener('click', () => {
    const atual = visor.querySelector('object');
    const novo = atual.cloneNode(true);
    novo.data = botao.dataset.pdf;
    atual.replaceWith(novo);
    botoes.forEach(b => b.setAttribute('aria-pressed', String(b === botao)));
  }));
</script>

</body>
</html>
